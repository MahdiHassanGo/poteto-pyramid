<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pyrGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pyrGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pyrGradApex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield / Hexagon Frame (Subtle) -->
  <polygon points="256,44 456,152 456,368 256,476 56,368 56,152" 
           fill="none" 
           stroke="#6366F1" 
           stroke-width="8" 
           stroke-dasharray="12,12" 
           opacity="0.4"/>

  <!-- Pyramid Tier 1 (Base - Architecture & Codebase) -->
  <polygon points="96,396 416,396 376,324 136,324" 
           fill="url(#pyrGrad1)" 
           filter="url(#glow)"/>
  
  <!-- Foundation Blocks in Base Tier -->
  <line x1="216" y1="324" x2="204" y2="396" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <line x1="296" y1="324" x2="308" y2="396" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>

  <!-- Pyramid Tier 2 (Middle - Deterministic Checks & Tests) -->
  <polygon points="144,312 368,312 328,240 184,240" 
           fill="url(#pyrGrad2)" 
           filter="url(#glow)"/>
  
  <!-- Checkmark Emblem on Tier 2 -->
  <path d="M236,276 L250,290 L278,260" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Pyramid Tier 3 (Apex - Trust & Verification) -->
  <polygon points="192,228 320,228 256,112" 
           fill="url(#pyrGradApex)" 
           filter="url(#glow)"/>

  <!-- Beacon / Spark at the Apex -->
  <circle cx="256" cy="112" r="10" fill="#FDE68A"/>
  <line x1="256" y1="76" x2="256" y2="94" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="96" x2="236" y2="104" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <line x1="292" y1="96" x2="276" y2="104" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
</svg>
